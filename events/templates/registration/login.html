{% extends 'base.html' %}

{% block title %}Connexion{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Connexion</h2>
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Se connecter</button>
    </form>
    
    <p>Pas encore de compte ? <a href="{% url 'register' %}">S'inscrire</a></p>
    
    <p><a href="{% url 'event_list' %}">Voir les événements sans se connecter</a></p>
</div>
{% endblock %}
