{% extends 'base.html' %}

{% block title %}Inscription{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Inscription</h2>
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">S'inscrire</button>
    </form>
    
    <p>Déjà inscrit ? <a href="{% url 'login' %}">Se connecter</a></p>
</div>
{% endblock %}
